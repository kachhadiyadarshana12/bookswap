<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Change Password - BookSwap</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'surface-dim': '#dcd9d9', 'on-primary': '#ffffff', 'inverse-on-surface': '#f3f0f0', 'surface-container-low': '#f6f3f2', 'on-surface': '#1b1c1c', 'surface-container-lowest': '#ffffff', 'on-tertiary-fixed-variant': '#574500', primary: '#570013', 'inverse-surface': '#303030', 'on-secondary-container': '#576959', surface: '#fcf9f8', 'surface-container-highest': '#e4e2e1', secondary: '#516353', 'inverse-primary': '#ffb3b5', 'tertiary-fixed': '#ffe088', 'tertiary-container': '#cca730', 'on-background': '#1b1c1c', 'on-tertiary': '#ffffff', 'on-tertiary-fixed': '#241a00', 'surface-variant': '#e4e2e1', 'primary-fixed': '#ffdada', 'outline-variant': '#e0bfbf', 'secondary-fixed': '#d4e8d4', 'surface-container-high': '#eae7e7', background: '#fcf9f8', 'surface-tint': '#af2b3e', 'on-secondary-fixed': '#0f1f13', 'secondary-container': '#d4e8d4', 'on-surface-variant': '#584141', 'primary-fixed-dim': '#ffb3b5', 'on-primary-fixed-variant': '#8e0f28', 'on-primary-container': '#ff828a', 'primary-container': '#800020', 'on-secondary-fixed-variant': '#3a4b3c', 'on-primary-fixed': '#40000b', tertiary: '#735c00', 'surface-container': '#f0eded', 'tertiary-fixed-dim': '#e9c349', 'on-tertiary-container': '#4f3d00', 'error-container': '#ffdad6', error: '#ba1a1a', outline: '#8c7071', 'on-secondary': '#ffffff', 'surface-bright': '#fcf9f8', 'on-error-container': '#93000a', 'on-error': '#ffffff', 'secondary-fixed-dim': '#b8ccb8'
            },
            fontFamily: {
              'display-lg-mobile': ['Playfair Display'], 'label-caps': ['Inter'], 'headline-md': ['Playfair Display'], 'headline-sm': ['Playfair Display'], 'body-sm': ['Inter'], 'display-lg': ['Playfair Display'], 'body-md': ['Inter'], 'body-lg': ['Inter']
            }
          }
        }
      }
    </script>
    <style>
      .texture-bg { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"); }
      .input-underline { border: none; border-bottom: 1px solid #e0bfbf; background: transparent; padding-left: 0; padding-right: 0; }
      .input-underline:focus { outline: none; box-shadow: none; border-bottom-color: #800020; }
    </style>
  </head>
  <body>
    {% include 'navbar.html' %}
    <div class="bg-background texture-bg min-h-screen flex items-center justify-center p-0 md:p-8 text-on-surface">
        <div class="w-full max-w-md bg-surface border border-outline-variant shadow-lg p-8 rounded-xl relative">

        <h2 class="text-3xl font-headline-md text-on-surface mb-6 text-center">Change Password</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded {% if message.tags == 'error' %}bg-error-container text-on-error-container{% else %}bg-primary-container text-on-primary{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'change_password' %}">
            {% csrf_token %}
            
            <div class="mb-5 relative">
                <label class="block font-label-caps text-label-caps text-on-surface-variant mb-1" for="current_password">Current Password</label>
                <input class="w-full input-underline font-body-md text-body-md text-on-surface py-2" id="current_password" type="password" name="current_password" required />
            </div>

            <div class="mb-5 relative">
                <label class="block font-label-caps text-label-caps text-on-surface-variant mb-1" for="new_password">New Password</label>
                <input class="w-full input-underline font-body-md text-body-md text-on-surface py-2" id="new_password" type="password" name="new_password" required />
            </div>

            <div class="mb-8 relative">
                <label class="block font-label-caps text-label-caps text-on-surface-variant mb-1" for="confirm_password">Confirm New Password</label>
                <input class="w-full input-underline font-body-md text-body-md text-on-surface py-2" id="confirm_password" type="password" name="confirm_password" required />
            </div>

            <button class="w-full bg-primary-container hover:bg-primary text-on-primary font-label-caps text-label-caps py-4 rounded-DEFAULT transition-colors duration-200 uppercase tracking-wider" type="submit">Change Password</button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="{% url 'user_profile' %}" class="text-primary hover:underline font-body-sm">Back to Profile</a>
        </div>

        </div>
    </div>
    {{% include 'footer.html' %}}
  </body>
</html>
