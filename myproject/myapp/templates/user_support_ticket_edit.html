<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Support Ticket | BookSwap</title>

    <!-- =========================================================
         GOOGLE FONTS
    ========================================================== -->

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================================
         MATERIAL SYMBOLS
    ========================================================== -->

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================================
         TAILWIND CSS
    ========================================================== -->

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- =========================================================
         TAILWIND CONFIG
    ========================================================== -->

        theme: {

            ========================= */

            colors: {

              "on-secondary": "#ffffff",

              error: "#ba1a1a",

              primary: "#570013",
              "primary-container": "#800020",

              "surface-bright": "#fcf9f8",

              "secondary-container": "#d4e8d4",
              "on-secondary-container": "#576959",

              "primary-fixed": "#ffdada",

              background: "#fcf9f8",
              "on-background": "#1b1c1c",

              "secondary-fixed": "#d4e8d4",

              "on-error": "#ffffff",

              outline: "#8c7071",

              "inverse-on-surface": "#f3f0f0",

              "on-secondary-fixed-variant": "#3a4b3c",
              "on-primary-fixed-variant": "#8e0f28",

              "surface-container": "#f0eded",
              "surface-container-high": "#eae7e7",
              "surface-container-low": "#f6f3f2",
              "surface-container-lowest": "#ffffff",

              "primary-fixed-dim": "#ffb3b5",

              "on-tertiary-fixed-variant": "#574500",

              secondary: "#516353",

              "on-primary-container": "#ff828a",

              "tertiary-fixed-dim": "#e9c349",

              "on-surface-variant": "#584141",
              "on-surface": "#1b1c1c",

              "on-error-container": "#93000a",

              "on-tertiary": "#ffffff",
              "tertiary-container": "#cca730",

              "surface-dim": "#dcd9d9",

              "inverse-primary": "#ffb3b5",

              "error-container": "#ffdad6",

              "on-primary-fixed": "#40000b",
              "on-primary": "#ffffff",

              "surface-tint": "#af2b3e",

              surface: "#fcf9f8",

              tertiary: "#735c00",

              "on-tertiary-fixed": "#241a00",
              "on-tertiary-container": "#4f3d00",

              "outline-variant": "#e0bfbf",

              "surface-variant": "#e4e2e1",

              "secondary-fixed-dim": "#b8ccb8",

              "on-secondary-fixed": "#0f1f13",

              "inverse-surface": "#303030"
            },

            /* =========================
               BORDER RADIUS
            ========================= */

            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },

            /* =========================
               SPACING
            ========================= */

            spacing: {
              gutter: "24px",
              "margin-mobile": "16px",
              "container-max": "1280px",
              base: "8px",
              "margin-desktop": "48px"
            },

            /* =========================
               FONT FAMILY
            ========================= */

            fontFamily: {
              "display-lg-mobile": ["Playfair Display"],
              "display-lg": ["Playfair Display"],
              "headline-sm": ["Playfair Display"],
              "headline-md": ["Playfair Display"],

              "body-lg": ["Inter"],

    </script>

    <!-- =========================================================
         GLOBAL CSS
    ========================================================== -->

    <style>
      /* ==============================
         GLOBAL DESIGN SYSTEM
      ============================== */

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background-color: #fcf9f8;
        color: #1b1c1c;
        font-family: "Inter", sans-serif;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Playfair Display", serif;
      }

      /* ==============================
         INPUTS
      ============================== */

      input,
      select,
      textarea {
        font-family: "Inter", sans-serif;
      }

      input::placeholder,
      textarea::placeholder {
        color: #8c7071;
        opacity: 0.75;
      }

      /* ==============================
         TEXT SELECTION
      ============================== */

      ::selection {
        background: #800020;
        color: #ffffff;
      }

      /* ==============================
         SCROLLBAR
      ============================== */

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #e4e2e1;
        border-radius: 9999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #8c7071;
      }

      /* ==============================
         FORM ELEMENTS
      ============================== */

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #570013 !important;

        box-shadow:
          0 0 0 2px rgba(87, 0, 19, 0.08) !important;

        outline: none;
      }

      /* ==============================
         SMOOTH TRANSITIONS
      ============================== */

      input,
      select,
      textarea,
      button,
      a {
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }

      /* ==============================
         TEXTAREA
      ============================== */

      textarea {
        resize: vertical;
        min-height: 160px;
      }

      /* ==============================
         RESPONSIVE
      ============================== */

      @media (max-width: 1024px) {
        main {
          margin-left: 0 !important;
        }
      }

      @media (max-width: 768px) {
        main {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }
      }

      @media (max-width: 640px) {
        main {
          padding-top: 24px !important;
          padding-bottom: 24px !important;
        }
      }
    </style>
  </head>

  <body class="min-h-screen bg-[#fcf9f8] text-[#1b1c1c]">
    {% include 'navbar.html' %}

    <main class="mx-auto max-w-2xl px-6 py-16">
      <a
        href="{% url 'user_support_ticket_detail' ticket.id %}"
        class="text-sm font-semibold text-[#800020] hover:underline"
      >
        &larr; Back to ticket
      </a>

      <div
        class="mt-6 rounded-xl border border-[#e0bfbf] bg-white p-6 shadow-sm md:p-8"
      >
        <p
          class="text-xs font-semibold uppercase tracking-wider text-[#516353]"
        >
          Ticket #{{ ticket.id }}
        </p>

        <h1 class="mt-2 text-3xl font-bold text-[#570013]">
          Edit your query
        </h1>

        <form method="post" class="mt-6 space-y-5">
          {% csrf_token %}

          <div>
            <label
              for="support-subject"
              class="mb-2 block text-sm font-semibold text-[#570013]"
            >
              Subject
            </label>

            <input
              id="support-subject"
              name="subject"
              type="text"
              maxlength="200"
              value="{{ ticket.subject }}"
              required
              class="w-full rounded border border-[#e0bfbf] bg-white px-4 py-3"
            />
          </div>

          <div>
            <label
              for="support-category"
              class="mb-2 block text-sm font-semibold text-[#570013]"
            >
              Category
            </label>

            <select
              id="support-category"
              name="category"
              required
              class="w-full rounded border border-[#e0bfbf] bg-white px-4 py-3"
            >
              <option value="account"{% if ticket.category == 'account' %} selected{% endif %}>
                Account &amp; Profile
              </option>

              <option value="books"{% if ticket.category == 'books' %} selected{% endif %}>
                Books &amp; Listings
              </option>

              <option value="exchange"{% if ticket.category == 'exchange' %} selected{% endif %}>
                Book Exchange
              </option>

              <option value="orders"{% if ticket.category == 'orders' %} selected{% endif %}>
                Orders
              </option>

              <option value="payment"{% if ticket.category == 'payment' %} selected{% endif %}>
                Payments
              </option>

              <option value="delivery"{% if ticket.category == 'delivery' %} selected{% endif %}>
                Delivery
              </option>

              <option value="technical"{% if ticket.category == 'technical' %} selected{% endif %}>
                Technical Issue
              </option>

              <option value="other"{% if ticket.category == 'other' %} selected{% endif %}>
                Other
              </option>
            </select>
          </div>

          <div>
            <label
              for="support-message"
              class="mb-2 block text-sm font-semibold text-[#570013]"
            >
              Your query
            </label>

            <textarea
              id="support-message"
              name="message"
              rows="7"
              required
              class="w-full rounded border border-[#e0bfbf] bg-white px-4 py-3"
            >{{ ticket.message }}</textarea>
          </div>

          <button
            type="submit"
            class="rounded bg-[#800020] px-5 py-3 text-sm font-semibold uppercase tracking-wider text-white hover:bg-[#570013]"
          >
            Save changes
          </button>
        </form>
      </div>
    </main>

    {% include 'footer.html' %}
  </body>
</html>
